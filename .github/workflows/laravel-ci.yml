name: Laravel CI (SQLite + Lint)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, pdo_sqlite, sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Run Laravel Pint (Lint Check)
        run: vendor/bin/pint --test
        # --test means: check formatting but don't modify code
        # If Pint finds issues, CI will fail and show them in logs

      - name: Setup SQLite database and env
        run: |
          mkdir -p database
          touch database/database.sqlite
          echo "APP_NAME=Laravel" > .env
          echo "APP_ENV=local" >> .env
          echo "APP_KEY=" >> .env
          echo "APP_DEBUG=true" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env
          echo "APP_URL=http://localhost" >> .env
          php artisan key:generate

      - name: Clear and cache config
        run: |
          php artisan config:clear
          php artisan config:cache

      - name: Run migrations
        run: php artisan migrate --force

      - name: CI Complete
        run: echo " Laravel build, lint, and migrations completed successfully!"
